defaults: [base, backbone/gpt2, data/mult_4x4, decoder/light]

adapter:
  type: per_layer_affine+rmsnorm
  layer_pos_emb: true

fusion:
  type: attention_pooling
  d_model: 512
  fusion_type: residual

engine:
  type: hydra_qs
  d_model: 512
  d_state: 16
  n_blocks: 2
  damping_alpha: 0.5
  cycle_embedding: true
  reinject_r0: gate

iteration:
  train_m: {type: lognormal, mean: 6, max: 16}
  tbptt_k: 4

termination:
  type: delta_state
  eps: 1.0e-3
  m_max: 32

losses:
  - {type: answer_nll, w: 1.0}
  - {type: deep_supervision, w: 0.3, cycles: sample2}
  - {type: state_variance_reg, w: 0.01}

train:
  lr: 3.0e-4
  epochs: 5
  bs: 16
  seeds: [0]

sweep:
  engine.type: [hydra_qs, mamba_up, mamba_down, bidir_add, attn_block]
