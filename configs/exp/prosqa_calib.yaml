# ε 보정용 런 — §4.3 의 고정 ε 을 실측 Δ 자릿수에 맞춘다 (ADR-017 · F-028).
#
# ADR-017 로 상태 스케일이 RMS 1 부근에 묶이면서 Δ 가 10⁻² 대로 내려왔다.
# F-024 가 정한 ε=0.05 는 **정규화 없는** 초기 상태(RMS 0.008)에서 잡은 값이라
# 그대로 쓰면 m=0 에서 즉시 만족돼 `dynamic_m` 이 M=1 로 퇴화한다 — 폭주 때와
# 반대 방향의 같은 퇴화다.
#
# 전량 1 epoch 을 돌려 Δ 궤적을 재고, 그 범위 안에서 ε 을 고른다.
defaults: [exp/prosqa_gpt2]

train:
  epochs: 1
  log_every: 200
