# ProsQA 스모크 — 본 스윕 전에 "파이프라인이 이 과제를 돌리기는 하는가"만 본다.
#
# 여기서 보는 것은 **정확도가 아니라** (1) 끝까지 도는가, (2) 손실이 내려가는가,
# (3) 처리량이 얼마인가다. 처리량을 재야 15런짜리 본 스윕의 시간을 추정할 수
# 있다 — 작은 데이터 처리량으로 큰 런을 추정하면 어긋난다(2.4배 틀린 적이 있다).
defaults: [exp/prosqa_gpt2]

data:
  sizes: {train: 2000, val: 200, test: 200}

train:
  epochs: 1
  log_every: 25
