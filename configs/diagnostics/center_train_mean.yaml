# R2 — 고정 중심화가 정제를 질문에 반응하게 만드는가 (ADR-019, REVIEW_v2.2 §5)
#
# F-036(damping_fix) 과 정확히 하나만 다르다: memory.center: train_mean.
# 비교 대상은 F-036 의 세 시드다 — 정확도 0.5911 ±0.0069, 3/3 수렴, 마지막 사이클
# 샘플 간 Δ sd 0.0005~0.006, 전 샘플이 같은 사이클에서 정지, 홉↔M 무상관.
#
# 보는 것 (순서대로):
#   ① 마지막 사이클 Δ 의 샘플 간 표준편차 — 커지면 F-030 해소
#   ② 정지 사이클 분포와 홉↔M 상관 — §4.3·§7.2 가 살아나는가
#   ③ 정확도 — No-CoT 0.660 에 대해 움직이는가 (Phase A 만이라 직접 비교는
#      F-036 의 0.591 과)
#
# 게이트가 아니다. 답 감독 그대로, Phase A 만.
defaults: [diagnostics/damping_fix]

memory:
  center: train_mean
  center_samples: 1024     # F-040 이 이 크기로 쟀다

sweep:
  seed: [0, 1, 2]
