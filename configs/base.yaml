# Base configuration
#
# Reasoning width: d_model is NOT set here. It defaults to the backbone hidden size
# (d_in) so that no dimension reduction sits between the backbone context representation
# and the reasoning state, which is what lets proposal 3.4 fuse
#   h_fusion = h_orig_L + W_r * h_ssm
# with h_orig_L = R0[:, -1, :] directly. Set `adapter.d_model` to override.
seed: 42
deterministic: true

device: "auto"

train:
  epochs: 10
  bs: 64
  lr: 3.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  amp: false
  warmup_ratio: 0.1
  min_lr: 1.0e-5
  seeds: [0]

extract:
  batch_size: 16
  precision: "float32"
  position_rule: "last_token"
  shard_size: 5000
  cache_dir: "caches"

losses:
  - {type: answer_nll, w: 1.0}
