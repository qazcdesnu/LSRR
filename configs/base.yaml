# 공통 기본값
#
# 사고 메모리 폭 d_model은 여기서 정하지 않는다. 명시가 없으면 백본 폭 d_in을
# 따르되, d_in과 독립이다 (ADR-003) — 융합 잔차 앵커가 백본 원본 h^(L)로
# 옮겨가면서 d_model 제약이 풀렸다. 엔진 폭을 줄여 제안서 §5의 파라미터
# 예산("백본 대비 약 3% 이내")을 지키는 주된 노브가 memory.adapter.d_model이다.

seed: 42
deterministic: true
device: auto

memory:
  composer:
    type: gate          # H_last + H_pool 결합 (ADR-004)
  scope:
    type: all_layers    # Ablation A의 기준 조건
  adapter:
    type: per_layer_affine
    layer_pos_emb: true
    use_rmsnorm: true

engine:
  type: hydra_qs        # quasiseparable 양방향 (제안서 §4.2)
  d_state: 16
  n_blocks: 2
  damping_alpha: 0.8    # 감쇠 갱신 (v2.1 §4.2, Ablation D의 스윕 축)
  reinject_r0: gate     # R⁰ 재주입
  cycle_embedding: true # 사이클 임베딩

recurrence:
  schedule:
    type: lognormal     # M 무작위 샘플링 → 수렴 압력 (i) (제안서 §4.3)
    mean: 6
    std: 1.0
    max: 16
  tbptt_k: 4
  hooks:
    readout_per_cycle: false

termination:
  type: delta_state     # Δ<ε (Ablation B의 기준 조건)
  # Δ = 1/(L·d_ssm) Σ_l ‖·‖₁ 스케일 기준 (v2.1 §4.3). v1의 (1/L)Σ‖·‖₂ 와는
  # 값이 10~35배 다르므로 v1의 ε=1e-3 을 그대로 쓰면 안 된다 (F-024).
  # v2.1 §7-D 의 ε 스윕 범위가 0.01~0.20 이다.
  eps: 0.05
  m_min: 1              # 정지 하한 (v2.1 §4.3). 커리큘럼이 예산을 강제할 때 올린다
  m_max: 32             # 폴백 필수 (I5)

stability:
  type: none            # 사다리는 기본 꺼짐 (ADR-007)

readout:
  fusion:
    type: attention_pooling
    # 방출 공식 (v2.1 §4.4 개정):
    #   h⁽¹⁾ = s·RMSNorm(W_proj·h_ssm⁽¹⁾ + h⁽ᴸ⁾)
    #   h⁽ᵐ⁾ = s·RMSNorm(W_proj·h_ssm⁽ᵐ⁾)          (m > 1)
    #
    #   anchor=first 첫 토큰만 앵커 — v2 기본 (F-027)
    #   anchor=none  앵커 없음. 쉬운 과제에서 최선이나 통로가 늦게 열린다 (F-026)
    #   anchor=ctx   v1 잔차 융합. **Ablation A 의 대조군이므로 보존한다**
    #   anchor=ramp  σ(g)·보정 — 분화는 최고지만 거의 쓰이지 않는다
    anchor: first
    fusion_type: residual   # anchor=ctx 일 때 h_ctx 와 결합하는 방식
    w_r_init_scale: 0.01    # 작게 시작 → 학습 초기에 사고 항이 점진적으로 켜짐
  path:
    type: backbone_continuation   # 학습 디코더 없음 (ADR-001)
    max_new_tokens: 32
    # 방출 구조 — Ablation A 의 축 (ADR-015·ADR-016)
    #   trajectory  사이클마다 토큰 1개씩 (v2 기본). 개수 M 은 termination 이 정한다
    #   single      마지막 상태에서 토큰 1개 (v1 대조군)
    emission: trajectory

objective:
  answer_nll:
    enabled: true
    w: 1.0
  deep_supervision:
    enabled: false
    w: 0.3
    gamma: 0.85
    num_cycles: 2
  variance_reg:
    enabled: false
    w: 0.01
    target_std: 1.0
  distillation:
    enabled: false        # ablation 전용 (제안서 §5)
    w: 0.0

train:
  epochs: 10
  bs: 16
  lr: 3.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  amp: false
  warmup_ratio: 0.1
  min_lr: 1.0e-5
  seeds: [0]

eval:
  split: test
  max_new_tokens: 32
  anytime_curve: true

extract:
  batch_size: 16
  precision: float32
  shard_size: 5000
  cache_dir: caches
