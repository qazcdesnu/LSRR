# 게이트 ③ **2단 — 킬 스위치** (ADR-016 재개정)
#
# 1단(`A_emission_prosqa.yaml`, Phase A 동결)은 기준선이다. 학습되지 않은
# 수신기 앞에서는 궤적 방출이 이길 이유가 없으므로 거기서는 판정하지 않는다.
# 여기서 판정한다: 세 조건 모두 같은 LoRA 예산으로 Phase B 정렬을 받은 뒤
# `dynamic_m` 이 `single_v1` 을 이기는가.
#
# **1단의 Phase A 체크포인트 위에 Phase B 만 얹는다.** "나머지 동일" 의 가장 강한
# 형태다 — 같은 가중치에서 출발하므로 Phase A 의 난수 편차(F-032: 시드마다
# 수축/진동이 갈린다)가 두 단계 사이에 끼어들지 않는다. 비용도 1/4 이다.
#
#   python scripts/sweep.py exp=ablation/A_emission_prosqa_stage2 \
#       --init-from-sweep ablation/A_emission_prosqa
#
# 판정: python scripts/check_gates.py --stage kill --runs-dir runs \
#           --treatment-glob '*stage2_condition_dynamic_m*' \
#           --control-glob   '*stage2_condition_single_v1*'
defaults: [ablation/A_emission_prosqa]

backbone:
  lora:
    r: 8
    alpha: 16
    dropout: 0.0
    target_modules: [c_attn, c_proj]

train:
  # Phase A 는 --init-from 으로 받는다. 여기서는 Phase B 만 돈다.
  # lr 은 A(1e-3)의 1/10 — 정렬 국면이라 방출기가 흔들리면 "순수 정렬 이득" 이
  # 아니게 된다. 5 epoch 은 dynamic_m 단독 2-phase 런과 같은 예산이다.
  phases:
    - {name: B, epochs: 5, lr: 1.0e-4, trainable: [emitter, lora]}
