# Ablation A — 메모리 범위 (제안서 §7)
# 레이어 축 전개가 사고 메모리로서 효용이 있는가. 구간 절제는 층별 효용
# 불균등 가설(stages)의 검증을 겸한다.
#
# 구간 경계는 레이어 수의 **비율**로 지정한다 — 절대 인덱스로 두면 백본을
# 바꿀 때 의미가 달라진다 (memory/README.md).
defaults: [base, backbone/gpt2]

data:
  type: prosqa

sweep:
  memory.scope.type: [final_only, all_layers, mid_band, late_band]

memory:
  scope:
    mid_band: [0.33, 0.66]
    late_band: [0.66, 1.0]
