  - {model: "CoT (GPT-2)†",      accuracy: 0.429, std: 0.002, source: "Coconut Table 1", verified: true}
  - {model: "iCoT (GPT-2)†",     accuracy: 0.300, source: "iCoT 논문 Table 3 (ICoT-SI, GPT-2 Small); Coconut Table 1 도 인용", verified: true}
  - {model: "Coconut (GPT-2)†",  accuracy: 0.341, std: 0.015, source: "Coconut Table 1", verified: true}
  - {model: "No-CoT-SFT (GPT-2)†", accuracy: 0.191, source: "CODI Figure 3 (GPT-2)", verified: true}
  - {model: "iCoT (GPT-2)†",     accuracy: 0.301, source: "CODI Figure 3 (GPT-2, 재현)", verified: true}
  - {model: "Coconut (GPT-2)†",  accuracy: 0.341, source: "CODI Figure 3 (GPT-2, 재현)", verified: true}
  - {model: "CODI (GPT-2)†",     accuracy: 0.437, source: "CODI Figure 3 (GPT-2)", verified: true}
  - {model: "CoT-SFT (GPT-2)†",  accuracy: 0.441, source: "CODI Figure 3 (GPT-2)", verified: true}
