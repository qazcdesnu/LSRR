[project]
name = "lsrr"
version = "0.1.0"
description = "Layer-State Recurrent Reasoner (LSRR) Research Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "accelerate",
    "safetensors",
    "omegaconf",
    "pyyaml",
    "datasets",
    "pandas",
    "tabulate",
    "tqdm",
    "peft>=0.20.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lsrr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "contract: 아키텍처 불변식(I1-I8) 계약 테스트",
    "slow: 느린 테스트 (백본 로드 등)",
]
